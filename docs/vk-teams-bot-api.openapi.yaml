        - thread
      operationId: thread.add
      x-n8n-operation: thread.add
      summary: Create a thread under an existing message. Use threadId as the target
        chatId for subsequent messages.
      x-verification:
        method: Official specification and Python/Go SDK cross-check; no live bot test
        date: 2026-09-25
      parameters:
        - $ref: "#/components/parameters/token"
        - $ref: "#/components/parameters/chatId"
        - $ref: "#/components/parameters/msgId"
      responses:
        "200":
          description: Successful response or logical API error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ThreadResponse"
                  - $ref: "#/components/schemas/ApiError"
  /threads/autosubscribe:
    get:
      tags:
        - thread
      operationId: thread.autosubscribe
      x-n8n-operation: thread.autosubscribe
      summary: Configure the bot subscription explicitly. Trigger activation never
        calls this method automatically.
      x-verification:
        method: Official specification and Python/Go SDK cross-check; no live bot test
        date: 2026-09-25
      parameters:
        - $ref: "#/components/parameters/token"
        - $ref: "#/components/parameters/chatId"
        - $ref: "#/components/parameters/enable"
        - $ref: "#/components/parameters/withExisting"
      responses:
        "200":
          description: Successful response or logical API error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/ApiError"
  /threads/subscribers/get:
    get:
      tags:
        - thread
      operationId: thread.getSubscribers
      x-n8n-operation: thread.getSubscribers
      summary: Return one page. Provide pageSize for the first page or an opaque
        cursor for the next page. No automatic pagination.
      x-verification:
        method: Official specification and Python/Go SDK cross-check; no live bot test
        date: 2026-09-25
      parameters:
        - $ref: "#/components/parameters/token"
        - $ref: "#/components/parameters/threadId"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Successful response or logical API error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ThreadSubscribersResponse"
                  - $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    botTokenQuery:
      type: apiKey
      in: query
      name: token
  parameters:
    token:
      name: token
      in: query
      required: true
      schema:
        type: string
      description: Bot token received from Metabot.
    chatId:
      name: chatId
      in: query
      required: true
      schema:
        type: string
      description: Chat id or user id.
      examples:
        privateUser:
          value: "@user_id_example"
        groupOrChannel:
          value: 681869378@chat.agent
    text:
      name: text
      in: query
      required: true
      schema:
        type: string
      description: Message text.
    callbackText:
      name: text
      in: query
      required: false
      schema:
        type: string
      description: Optional callback answer text.
    msgId:
      name: msgId
      in: query
      required: true
      schema:
        type: string
      description: Message id. Public docs mark this as integer; API responses and node inputs keep it as string.
    msgIds:
      name: msgId
      in: query
      required: true
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        items:
          type: string
      description: Message ids serialized as repeated msgId query parameters.
    fileId:
      name: fileId
      in: query
      required: true
      schema:
        type: string
      description: Uploaded VK Teams file id.
    caption:
      name: caption
      in: query
      required: false
      schema:
        type: string
      description: File caption.
    replyMsgId:
      name: replyMsgId
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
        minItems: 1
        uniqueItems: true
      description: Unique nonempty string message IDs, serialized as repeated query
        parameters. Reply and Forward modes are mutually exclusive.
    forwardChatId:
      name: forwardChatId
      in: query
      required: false
      schema:
        type: string
      description: Source chat ID; must be supplied together with forwardMsgId. Not
        used in Reply mode.
    forwardMsgId:
      name: forwardMsgId
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
        minItems: 1
        uniqueItems: true
      description: Unique nonempty string message IDs, serialized as repeated query
        parameters. Reply and Forward modes are mutually exclusive.
    inlineKeyboardMarkup:
      name: inlineKeyboardMarkup
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/InlineKeyboardMarkup"
      description: Inline keyboard markup serialized as query parameter.
    format:
      name: format
      in: query
      required: false
      description: One JSON-encoded format object. Mutually exclusive with parseMode.
        Ranges are supplied by the caller and are not recalculated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Format"
    parseMode:
      name: parseMode
      in: query
      required: false
      schema:
        type: string
        enum: [MarkdownV2, HTML]
      description: Server-side text parse mode.
    queryId:
      name: queryId
      in: query
      required: true
      schema:
        type: string
      description: Callback query id from callbackQuery event payload.
    showAlert:
      name: showAlert
      in: query
      required: false
      schema:
        type: boolean
      description: Show callback answer as alert.
    url:
      name: url
      in: query
      required: false
      schema:
        type: string
        format: uri
      description: Optional URL to open from callback answer.
    lastEventId:
      name: lastEventId
      in: query
      required: true
      schema:
        type: integer
        minimum: 0
      description: Last processed event id. Use 0 for initial long poll.
    pollTime:
      name: pollTime
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      description: Long-poll timeout in seconds.
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor from a previous member/subscriber page; omit for the
        first page.
    title:
      name: title
      in: query
      required: true
      schema:
        type: string
        minLength: 1
      description: New nonempty title.
    about:
      name: about
      in: query
      required: true
      schema:
        type: string
      description: New description; an empty string clears it.
    rules:
      name: rules
      in: query
      required: true
      schema:
        type: string
      description: New rules; an empty string clears them.
    userId:
      name: userId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
      description: User ID to block or unblock.
    pendingUserId:
      name: userId
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: Single join request to process. Mutually exclusive with everyone=true.
    everyone:
      name: everyone
      in: query
      required: false
      schema:
        type: boolean
        const: true
      description: Process all pending join requests. Never inferred from an empty user ID.
    approve:
      name: approve
      in: query
      required: true
      schema:
        type: boolean
      description: Approve when true; reject when false. Applies to the explicitly selected target.
    delLastMessages:
      name: delLastMessages
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Also remove recent messages of the blocked user. Defaults to false.
    members:
      name: members
      in: query
      required: true
      description: One JSON-encoded array of objects with sn. The n8n input is a nonempty array of distinct user
        ID strings.
      content:
        application/json:
          schema:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: object
              required:
              - sn
              properties:
                sn:
                  type: string
                  minLength: 1
              additionalProperties: false
    actions:
      name: actions
      in: query
      required: true
      style: form
      explode: true
      schema:
        type: array
        uniqueItems: true
        items:
          type: string
          enum:
          - typing
          - looking
      description: Repeated actions query keys, for example actions=typing&actions=looking. The empty string clears activity indicators.
    threadId:
      name: threadId
      in: query
      required: true
      schema:
        type: string
        minLength: 1
      description: Thread chat ID.
    pageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: Positive safe integer for the first page. Required unless cursor is
        provided.
    enable:
      name: enable
      in: query
      required: true
      schema:
        type: boolean
      description: Enable or disable bot thread autosubscription explicitly.
    withExisting:
      name: withExisting
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Include existing threads only when explicitly requested.

  schemas:
    ApiError:
      type: object
      required: [ok, description]
      properties:
        ok:
          type: boolean
          const: false
        description:
          type: string
      additionalProperties: true
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
      additionalProperties: true
    MessageResponse:
      type: object
      required: [ok, msgId]
      properties:
        ok:
          type: boolean
          const: true
        msgId:
          type: string
      additionalProperties: true
    UploadMessageResponse:
      type: object
      required: [ok, msgId, fileId]
      properties:
        ok:
          type: boolean
          const: true
        msgId:
          type: string
        fileId:
          type: string
      additionalProperties: true
    Bot:
      type: object
      required: [ok, userId, nick]
      properties:
        ok:
          type: boolean
          const: true
        userId:
          type: string
        nick:
          type: string
        firstName:
          type: string
        about:
          type: string
        photo:
          type: array
          items:
            $ref: "#/components/schemas/UrlObject"
      additionalProperties: true
    UrlObject:
      type: object
      properties:
        url:
          type: string
          format: uri
      additionalProperties: true
    FileInfo:
      type: object
      required: [url]
      properties:
        ok:
          type: boolean
        type:
          type: string
          examples: [video, image, audio]
        size:
          type: integer
        filename:
          type: string
        url:
          type: string
          format: uri
      additionalProperties: true
    Chat:
      oneOf:
        - $ref: "#/components/schemas/PrivateChat"
        - $ref: "#/components/schemas/GroupChat"
        - $ref: "#/components/schemas/ChannelChat"
    PrivateChat:
      type: object
      required: [type]
      properties:
        ok:
          type: boolean
        type:
          type: string
          const: private
        firstName:
          type: string
        lastName:
          type: string
        nick:
          type: string
        about:
          type: string
        isBot:
          type: boolean
        language:
          type: string
          description: ISO 639-1 language code.
      additionalProperties: true
    GroupChat:
      type: object
      required: [type]
      properties:
        ok:
          type: boolean
        type:
          type: string
          const: group
        title:
          type: string
        about:
          type: string
        rules:
          type: string
        inviteLink:
          type: string
          format: uri
        public:
          type: boolean
        joinModeration:
          type: boolean
      additionalProperties: true
    ChannelChat:
      type: object
      required: [type]
      properties:
        ok:
          type: boolean
        type:
          type: string
          const: channel
        title:
          type: string
        about:
          type: string
        rules:
          type: string
        inviteLink:
          type: string
          format: uri
        public:
          type: boolean
        joinModeration:
          type: boolean
      additionalProperties: true
    UploadFileRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
    EventsResponse:
      type: object
      required: [ok, events]
      properties:
        ok:
          type: boolean
          const: true
        events:
          type: array
          items:
            $ref: "#/components/schemas/SupportedEvent"
      additionalProperties: true
    SupportedEvent:
      oneOf:
        - $ref: "#/components/schemas/NewMessageEvent"
        - $ref: "#/components/schemas/EditedMessageEvent"
        - $ref: "#/components/schemas/DeletedMessageEvent"
        - $ref: "#/components/schemas/CallbackQueryEvent"
        - $ref: "#/components/schemas/UnpinnedMessageEvent"
        - $ref: "#/components/schemas/PinnedMessageEvent"
        - $ref: "#/components/schemas/LeftChatMembersEvent"
        - $ref: "#/components/schemas/NewChatMembersEvent"
      discriminator:
        propertyName: type
        mapping:
          newMessage: "#/components/schemas/NewMessageEvent"
          editedMessage: "#/components/schemas/EditedMessageEvent"
          deletedMessage: "#/components/schemas/DeletedMessageEvent"
          callbackQuery: "#/components/schemas/CallbackQueryEvent"
          unpinnedMessage: "#/components/schemas/UnpinnedMessageEvent"
          pinnedMessage: "#/components/schemas/PinnedMessageEvent"
          leftChatMembers: "#/components/schemas/LeftChatMembersEvent"
          newChatMembers: "#/components/schemas/NewChatMembersEvent"
    BaseEvent:
      type: object
      required: [eventId, type, payload]
      properties:
        eventId:
          type: integer
        type:
          type: string
        payload:
          type: object
      additionalProperties: true
    NewMessageEvent:
      allOf:
        - $ref: "#/components/schemas/BaseEvent"
        - type: object
          x-n8n-trigger-event: message
          x-raw-api-event-type: newMessage
          description: Raw VK Teams event type is newMessage; n8n exposes this trigger option as message.
          properties:
            type:
              type: string
              const: newMessage
            payload:
              $ref: "#/components/schemas/MessagePayload"
    EditedMessageEvent:
      allOf:
        - $ref: "#/components/schemas/BaseEvent"
        - type: object
          properties:
            type:
              type: string
              const: editedMessage
            payload:
              allOf:
                - $ref: "#/components/schemas/MessagePayload"
                - type: object
                  properties:
                    editedTimestamp:
                      type: integer
    DeletedMessageEvent:
      allOf:
        - $ref: "#/components/schemas/BaseEvent"
        - type: object
          properties:
            type:
              type: string
              const: deletedMessage
            payload:
              type: object
              required: [msgId, chat]
              properties:
                msgId:
                  type: string
                chat:
                  $ref: "#/components/schemas/EventChat"
                timestamp:
                  type: integer
              additionalProperties: true
    CallbackQueryEvent:
      allOf:
        - $ref: "#/components/schemas/BaseEvent"
        - type: object
          properties:
            type:
              type: string
              const: callbackQuery
            payload:
              type: object
              required: [queryId, from, callbackData]
              properties:
                queryId:
                  type: string
                chat:
                  $ref: "#/components/schemas/EventChat"
                from:
                  $ref: "#/components/schemas/EventUser"
                message:
                  $ref: "#/components/schemas/NestedMessage"
                callbackData:
                  type: string
              additionalProperties: true
    MessagePayload:
      type: object
      required: [ msgId, chat, from ]
      properties:
        msgId:
          type: string
        chat:
          $ref: "#/components/schemas/EventChat"
        from:
          $ref: "#/components/schemas/EventUser"
        timestamp:
          type: integer
        text:
          type: string
        format:
          $ref: "#/components/schemas/Format"
        parts:
          type: array
          items:
            $ref: "#/components/schemas/MessagePart"
        parent_topic:
          $ref: "#/components/schemas/ThreadParent"
      additionalProperties: true
    NestedMessage:
      type: object
      properties:
        msgId:
          type: string
        chat:
          $ref: "#/components/schemas/EventChat"
        from:
          $ref: "#/components/schemas/EventUser"
        text:
          type: string
        format:
          $ref: "#/components/schemas/Format"
        timestamp:
          type: integer
        parent_topic:
          $ref: "#/components/schemas/ThreadParent"
      additionalProperties: true
    EventChat:
      type: object
      required: [chatId]
      properties:
        chatId:
          type: string
        type:
          type: string
          enum: [private, group, channel]
        title:
          type: string
      additionalProperties: true
    EventUser:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
      additionalProperties: true
    MessagePart:
      oneOf:
        - $ref: "#/components/schemas/FilePart"
        - $ref: "#/components/schemas/VoicePart"
        - $ref: "#/components/schemas/StickerPart"
        - $ref: "#/components/schemas/MentionPart"
        - $ref: "#/components/schemas/ForwardPart"
        - $ref: "#/components/schemas/ReplyPart"
      discriminator:
        propertyName: type
        mapping:
          file: "#/components/schemas/FilePart"
          voice: "#/components/schemas/VoicePart"
          sticker: "#/components/schemas/StickerPart"
          mention: "#/components/schemas/MentionPart"
          forward: "#/components/schemas/ForwardPart"
          reply: "#/components/schemas/ReplyPart"
    FilePart:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          const: file
        payload:
          type: object
          required: [fileId]
          properties:
            fileId:
              type: string
            type:
              type: string
              enum: [image, audio, video]
            caption:
              type: string
            format:
              $ref: "#/components/schemas/Format"
          additionalProperties: true
    VoicePart:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          const: voice
        payload:
          $ref: "#/components/schemas/FileIdPayload"
    StickerPart:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          const: sticker
        payload:
          $ref: "#/components/schemas/FileIdPayload"
    FileIdPayload:
      type: object
      required: [fileId]
      properties:
        fileId:
          type: string
      additionalProperties: true
    MentionPart:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          const: mention
        payload:
          $ref: "#/components/schemas/EventUser"
    ForwardPart:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          const: forward
        payload:
          type: object
          properties:
            message:
              $ref: "#/components/schemas/NestedMessage"
          additionalProperties: true
    ReplyPart:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          const: reply
        payload:
          type: object
          properties:
            message:
              $ref: "#/components/schemas/NestedMessage"
          additionalProperties: true
    InlineKeyboardMarkup:
      type: array
      items:
        type: array
        items:
          oneOf:
            - $ref: "#/components/schemas/UrlKeyboardButton"
            - $ref: "#/components/schemas/CallbackKeyboardButton"
    UrlKeyboardButton:
      type: object
      required: [text, url]
      properties:
        text:
          type: string
        url:
          type: string
          format: uri
        style:
          $ref: "#/components/schemas/KeyboardButtonStyle"
    CallbackKeyboardButton:
      type: object
      required: [text, callbackData]
      properties:
        text:
          type: string
        callbackData:
          type: string
        style:
          $ref: "#/components/schemas/KeyboardButtonStyle"
    KeyboardButtonStyle:
      type: string
      enum: [attention, primary, base]
      default: base
    Format:
      type: object
      additionalProperties: false
      properties:
        bold:
          type: array
          items:
            $ref: "#/components/schemas/FormatRange"
        italic:
          type: array
          items:
            $ref: "#/components/schemas/FormatRange"
        underline:
          type: array
          items:
            $ref: "#/components/schemas/FormatRange"
        strikethrough:
          type: array
          items:
            $ref: "#/components/schemas/FormatRange"
        link:
          type: array
          items:
            $ref: "#/components/schemas/LinkFormatRange"
        mention:
          type: array
          items:
            $ref: "#/components/schemas/FormatRange"
        inline_code:
          type: array
          items:
            $ref: "#/components/schemas/FormatRange"
        pre:
          type: array
          items:
            $ref: "#/components/schemas/PreFormatRange"
        ordered_list:
          type: array
          items:
            $ref: "#/components/schemas/FormatRange"
        unordered_list:
          type: array
          items:
            $ref: "#/components/schemas/FormatRange"
        quote:
          type: array
          items:
            $ref: "#/components/schemas/FormatRange"
    FormatRange:
      type: object
      required: [offset, length]
      properties:
        offset:
          type: integer
          minimum: 0
        length:
          type: integer
          minimum: 1
    LinkFormatRange:
      allOf:
        - $ref: "#/components/schemas/FormatRange"
        - type: object
          required: [url]
          properties:
            url:
              type: string
              format: uri
    PreFormatRange:
      allOf:
        - $ref: "#/components/schemas/FormatRange"
        - type: object
          properties:
            code:
              type: string
              description: Optional pre/code language, named code in the official parameter
                schema.
    ChatMember:
      type: object
      required:
      - userId
      properties:
        userId:
          type: string
        admin:
          type: boolean
        creator:
          type: boolean
      additionalProperties: true
    ChatMembersResponse:
      type: object
      required:
      - members
      properties:
        ok:
          type: boolean
          const: true
        members:
          type: array
          items:
            $ref: '#/components/schemas/ChatMember'
        cursor:
          type:
          - string
          - 'null'
          description: Pass to getMembers for the next page. Missing, empty or null means no next page.
      additionalProperties: true
    ChatAdminsResponse:
      type: object
      required:
      - admins
      properties:
        ok:
          type: boolean
          const: true
        admins:
          type: array
          items:
            $ref: '#/components/schemas/ChatMember'
      additionalProperties: true
    ChatUsersResponse:
      type: object
      required:
      - users
      properties:
        ok:
          type: boolean
          const: true
        users:
          type: array
          items:
            $ref: '#/components/schemas/EventUser'
      additionalProperties: true
    ChatAvatarResponse:
      allOf:
      - $ref: '#/components/schemas/OkResponse'
      - type: object
        properties:
          description:
            type:
            - string
            - 'null'
    ChatAvatarUpload:
      type: object
      required:
      - image
      properties:
        image:
          type: string
          format: binary
      additionalProperties: false
    NewChatMembersEvent:
      allOf:
      - $ref: '#/components/schemas/BaseEvent'
      - type: object
        x-n8n-trigger-event: newChatMembers
        properties:
          type:
            type: string
            const: newChatMembers
          payload:
            type: object
            required:
            - chat
            - newMembers
            properties:
              chat:
                $ref: '#/components/schemas/EventChat'
              newMembers:
                type: array
                items:
                  $ref: '#/components/schemas/EventUser'
              addedBy:
                $ref: '#/components/schemas/EventUser'
            additionalProperties: true
    LeftChatMembersEvent:
      allOf:
      - $ref: '#/components/schemas/BaseEvent'
      - type: object
        x-n8n-trigger-event: leftChatMembers
        properties:
          type:
            type: string
            const: leftChatMembers
          payload:
            type: object
            required:
            - chat
            - leftMembers
            properties:
              chat:
                $ref: '#/components/schemas/EventChat'
              leftMembers:
                type: array
                items:
                  $ref: '#/components/schemas/EventUser'
              removedBy:
                $ref: '#/components/schemas/EventUser'
            additionalProperties: true
    PinnedMessageEvent:
      allOf:
      - $ref: '#/components/schemas/BaseEvent'
      - type: object
        x-n8n-trigger-event: pinnedMessage
        properties:
          type:
            type: string
            const: pinnedMessage
          payload:
            type: object
            required:
            - chat
            - msgId
            properties:
              chat:
                $ref: '#/components/schemas/EventChat'
              msgId:
                type: string
              timestamp:
                type: integer
              from:
                $ref: '#/components/schemas/EventUser'
              text:
                type: string
              format:
                $ref: '#/components/schemas/Format'
            additionalProperties: true
    UnpinnedMessageEvent:
      allOf:
      - $ref: '#/components/schemas/BaseEvent'
      - type: object
        x-n8n-trigger-event: unpinnedMessage
        properties:
          type:
            type: string
            const: unpinnedMessage
          payload:
            type: object
            required:
            - chat
            - msgId
            properties:
              chat:
                $ref: '#/components/schemas/EventChat'
              msgId:
                type: string
              timestamp:
                type: integer
            additionalProperties: true
    ThreadResponse:
      type: object
      required:
        - threadId
      properties:
        ok:
          type: boolean
          const: true
        threadId:
          type: string
      additionalProperties: true
    ThreadSubscriber:
      type: object
      required:
        - sn
      properties:
        sn:
          type: string
        userState:
          type: object
          properties:
            lastseen:
              type: integer
          additionalProperties: true
      additionalProperties: true
    ThreadSubscribersResponse:
      type: object
      required:
        - subscribers
      properties:
        ok:
          type: boolean
          const: true
        cursor:
          type:
            - string
            - "null"
        subscribers:
          type: array
          items:
            $ref: "#/components/schemas/ThreadSubscriber"
      additionalProperties: true
    ThreadParent:
      type: object
      properties:
        chatId:
          type: string
        messageId:
          type: integer
        type:
          type: string
      additionalProperties: true
      description: Incoming parent_topic metadata. Include Threads optionally matches
        its chatId; outgoing messages use the thread chat ID, not an inferred
        parent_topic parameter.
