          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/EventsResponse"
                  - $ref: "#/components/schemas/ApiError"
      x-n8n-include-threads: "Optional includeThreads=false by default: additionally
        match the parent_topic.chatId (including nested callback message)
        against the configured chat IDs. User filtering is unchanged."
  /chats/getMembers:
    get:
      tags:
      - chat
      operationId: chat.getMembers
      x-n8n-operation: chat.getMembers
      x-verification:
        method: Official OpenAPI and SDK contract cross-check; no live bot test
        date: '2026-09-25'
      summary: getMembers for an existing chat.
      description: VK Teams enforces bot permissions. Availability can depend on the server version and configuration.
        Returns one page; preserve the opaque cursor and request the next page explicitly.
      parameters:
      - $ref: '#/components/parameters/token'
      - $ref: '#/components/parameters/chatId'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Successful response or logical API error.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ChatMembersResponse'
