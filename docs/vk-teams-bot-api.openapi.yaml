                  - $ref: "#/components/schemas/ApiError"
      x-n8n-file-source: binary
      x-sdk-extension-verification: "2026-09-25: optional parameters checked against
        the official specification/SDKs; not live-tested."
    get:
      tags:
        - message
      operationId: message.sendVoiceById
      x-n8n-operation: message.sendVoice
      x-n8n-file-source: fileId
      summary: Send an existing voice message by fileId without uploading it again.
      parameters:
        - $ref: "#/components/parameters/token"
        - $ref: "#/components/parameters/chatId"
        - $ref: "#/components/parameters/fileId"
        - $ref: "#/components/parameters/replyMsgId"
        - $ref: "#/components/parameters/forwardChatId"
        - $ref: "#/components/parameters/forwardMsgId"
        - $ref: "#/components/parameters/inlineKeyboardMarkup"
      responses:
        "200":
          description: Message ID or logical API error; no newly uploaded fileId is
            required.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MessageResponse"
                  - $ref: "#/components/schemas/ApiError"
      x-sdk-extension-verification: "2026-09-25: optional parameters checked against
        the official specification/SDKs; not live-tested."
  /messages/editText:
    get:
      tags: [ message ]
      operationId: message.editText
      x-n8n-operation: message.editText
      summary: Edit message text.
      parameters:
        - $ref: "#/components/parameters/token"
        - $ref: "#/components/parameters/chatId"
        - $ref: "#/components/parameters/msgId"
        - $ref: "#/components/parameters/text"
        - $ref: "#/components/parameters/inlineKeyboardMarkup"
        - $ref: "#/components/parameters/format"
        - $ref: "#/components/parameters/parseMode"
      responses:
        "200":
          description: ok=true or logical API error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - $ref: "#/components/schemas/ApiError"
      x-sdk-extension-verification: "2026-09-25: optional parameters checked against
        the official specification/SDKs; not live-tested."
  /messages/deleteMessages:
    get:
      tags: [message]
      operationId: message.deleteMessages
      x-n8n-operation: message.deleteMessages
      x-live-observed:
        msgIdSerialization: repeated query parameters, for example msgId=1&msgId=2.
        rejectedSerializations:
          - msgId[]=1&msgId[]=2
          - msgId[0]=1&msgId[1]=2
          - msgId=1,2
      summary: Delete one or more messages.
      parameters:
        - $ref: "#/components/parameters/token"
        - $ref: "#/components/parameters/chatId"
        - $ref: "#/components/parameters/msgIds"
      responses:
        "200":
          description: ok=true or logical API error.
